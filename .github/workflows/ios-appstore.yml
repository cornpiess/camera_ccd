# iOS App Store —— 正式上架出包流水线：不带 CAMERA18_TESTING 的 Release 构建，上传 ASC 后提审。
#
# 与 ios-testflight.yml 的分工（archive/export 步骤同源，改一处记得同步另一处）：
#   ios-testflight.yml → 带 -DCAMERA18_TESTING，mock 光圈等测试设施编译进去，只进 TestFlight。
#   本文件             → 不带任何测试标志。这是【生产配置】——历史上从未编译过，第一次运行
#                        才是生产代码路径的首次真编译验证；mock 入口在生产配置里编译为诚实拒绝。
# 两者上传的是同一个 App Store Connect App；本流水线产出的 build 在 ASC 里选择后提审上架。
#
# 为什么不走 EAS：见 AGENTS.md 红线 1（EAS 免费额度 15 次/月 iOS）。本 workflow 不调用 EAS。
#
# 触发方式：仅手动（workflow_dispatch）。❌ 严禁加 push / schedule 自动触发。

name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或 tag
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ios-appstore
  cancel-in-progress: false

jobs:
  appstore:
    name: Build and upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ExpoModulesCore 55 requires an Xcode 26+ compiler. The iOS 27 physical-aperture API
      # is invoked through dynamic selectors on the Swift side (public API, compiles against
      # any SDK), so 26+ is enough to build; prefer 27+ when the runner has it.
      - name: Select Xcode
        run: |
          set -euo pipefail
          shopt -s nullglob
          XCODE_APPS=(/Applications/Xcode_2[6789]*.app)
          if [ "${#XCODE_APPS[@]}" -eq 0 ]; then
            echo "::error::runner 未安装 Xcode 26+，无法编译 Expo SDK 55。"
            exit 1
          fi
          XCODE_APP=$(printf '%s\n' "${XCODE_APPS[@]}" | sort | tail -1)
          echo "选择 $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          XV=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          echo "已选择 Xcode $XV"
          if [ "${XV%%.*}" -lt 26 ]; then
            echo "::error::xcode-select 后仍不是 Xcode 26+：$XV"
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 早失败：宁可 30 秒挂掉，也不要白等 30 分钟再被 App Store Connect 拒。
      - name: Preflight checks
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          fail=0

          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少 repository secret: $v"
              fail=1
            fi
          done

          BID=$(node -p "require('./app.json').expo.ios.bundleIdentifier || ''")
          echo "bundleIdentifier = $BID"
          case "$BID" in
            com.example.*|"")
              echo "::error::bundleIdentifier is a placeholder (\"$BID\") - Apple rejects com.example prefix."
              fail=1
              ;;
          esac

          XV=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          XM=${XV%%.*}
          echo "Xcode = $XV (major $XM)"
          if [ "${XM:-0}" -lt 26 ]; then
            echo "::error::Xcode is $XV - Expo SDK 55 requires Xcode 26+."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::前置检查未通过，终止构建。"
            exit 1
          fi
          echo "前置检查通过。"

      # export 的 method 值在 Xcode 16 变了名：app-store → app-store-connect。
      - name: Resolve export method
        run: |
          set -euo pipefail
          xcodebuild -version
          node -v
          npm -v
          pod --version
          XV=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          if [ "${XV%%.*}" -ge 16 ]; then
            METHOD=app-store-connect
          else
            METHOD=app-store
          fi
          echo "METHOD=$METHOD" >> "$GITHUB_ENV"
          echo "export method = $METHOD"

      - name: Install JS dependencies
        run: npm ci --no-audit --fund=false

      # --- 原生工程由 prebuild 现生成，不入库（.gitignore 已含 /ios/）---

      # 防撞号：TestFlight 与本流水线向 ASC 上传同一个 version string，CFBundleVersion
      # 必须全局唯一且递增。两个 workflow 的 run_number 是各自独立序列，直接用迟早撞号
      # （"bundle version must be higher than the previously uploaded version"）。
      # 本流水线统一 +10000 偏移；TestFlight 那边 run 数量级远到不了 10000。
      - name: Compute build number
        run: echo "IOS_BUILD_NUMBER=$(( ${{ github.run_number }} + 10000 ))" >> "$GITHUB_ENV"

      # IOS_BUILD_NUMBER 经 app.config.js 注入 ios.buildNumber（从 GITHUB_ENV 读取）。
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # altool 默认从这个目录找 AuthKey_<KEY_ID>.p8，xcodebuild 也用同一个路径，一处写入两处可用。
      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # 根治证书额度墙：与本文件同源的逻辑，见 ios-testflight.yml 同名步骤（AGENTS.md 1.1）。
      - name: Revoke stale Apple certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/revoke-authkey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const b64u = (input) => Buffer.from(input).toString('base64')
            .replace(/=+$/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          const now = Math.floor(Date.now() / 1000);
          const header = b64u(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }));
          const payload = b64u(JSON.stringify({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }));
          const signer = crypto.createSign('sha256');
          signer.update(`${header}.${payload}`);
          const signature = signer
            .sign({ key: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'revoke-authkey.p8')), dsaEncoding: 'ieee-p1363' }, 'base64')
            .replace(/=+$/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          const token = `${header}.${payload}.${signature}`;
          const api = 'https://api.appstoreconnect.apple.com/v1/certificates';
          const headers = { Authorization: `Bearer ${token}` };
          const main = async () => {
            const res = await fetch(`${api}?limit=200`, { headers });
            if (!res.ok) throw new Error(`list certificates HTTP ${res.status}: ${await res.text()}`);
            const { data = [] } = await res.json();
            if (data.length === 0) {
              console.log('no existing Apple certificates — quota is free');
              return;
            }
            for (const cert of data) {
              const del = await fetch(`${api}/${cert.id}`, { method: 'DELETE', headers });
              const kind = cert.attributes ? `${cert.attributes.certificateType} ${cert.attributes.displayName}` : cert.id;
              console.log(`${del.ok ? 'revoked' : 'FAILED to revoke'}: ${kind}`);
              if (!del.ok) console.log(`  HTTP ${del.status}: ${await del.text()}`);
            }
          };
          main().catch((error) => {
            console.error('certificate revoke step failed:', error.message);
            process.exit(1);
          });
          NODE

      # 注意：这里【故意没有】OTHER_SWIFT_FLAGS -DCAMERA18_TESTING —— 本文件存在的意义。
      # 生产配置从未被编译过（此前所有包都走 TestFlight 流水线），第一次运行若报编译错误，
      # 属于生产代码路径的真实问题，按报错修源码，不要把标志加回来。
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"

          archive_attempt=1
          archive_max=2
          while true; do
            echo "::group::Archive attempt $archive_attempt"
            if xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -jobs 2 \
              -quiet \
              COMPILER_INDEX_STORE_ENABLE=NO \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"; then
              echo "::endgroup::"
              echo "Archive OK on attempt $archive_attempt"
              break
            fi
            echo "::endgroup::"
            if [ "$archive_attempt" -ge "$archive_max" ]; then
              echo "::error::Archive failed $archive_max attempts (see log above)."
              exit 1
            fi
            archive_attempt=$((archive_attempt + 1))
            echo "::warning::Archive attempt failed; retry in 30s (cached build, lower memory pressure)..."
            sleep 30
          done

      - name: Export App Store .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Verify .ipa is self-contained
        env:
          EXPECTED_BUILD: ${{ env.IOS_BUILD_NUMBER }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/ipa"/*.ipa | head -1)
          rm -rf "$RUNNER_TEMP/unpack" && mkdir -p "$RUNNER_TEMP/unpack"
          unzip -q "$IPA" -d "$RUNNER_TEMP/unpack"
          APP_DIR=$(ls -d "$RUNNER_TEMP/unpack/Payload"/*.app | head -1)
          PLIST="$APP_DIR/Info.plist"

          BID=$(plutil -extract CFBundleIdentifier raw "$PLIST")
          BVER=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          BBUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          BNAME=$(plutil -extract CFBundleName raw "$PLIST")
          BDISPLAY=$(plutil -extract CFBundleDisplayName raw "$PLIST" 2>/dev/null || echo "(none)")
          echo "bundle=$BID version=$BVER build=$BBUILD name=$BNAME display=$BDISPLAY"

          if [ "$BBUILD" != "$EXPECTED_BUILD" ]; then
            echo "::error::CFBundleVersion=$BBUILD, expected $EXPECTED_BUILD - IOS_BUILD_NUMBER offset did not apply."
            exit 1
          fi

          if ! ls "$APP_DIR"/*.jsbundle >/dev/null 2>&1; then
            echo "::error::$APP_DIR 里没有任何 *.jsbundle - JS bundle 没有内嵌，装上去会白屏。"
            ls -la "$APP_DIR" | head -40
            exit 1
          fi

          {
            echo "BID=$BID"
            echo "BVER=$BVER"
            echo "BBUILD=$BBUILD"
            echo "BNAME=$BNAME"
            echo "BDISPLAY=$BDISPLAY"
            echo "IPA_PATH=$IPA"
          } >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          if xcrun altool --upload-app --type ios --file "$IPA_PATH" \
               --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
            echo "已通过 altool 上传。"
            exit 0
          fi

          echo "::warning::altool 上传失败，改用 xcodebuild -exportArchive destination=upload 重试。"
          tail -40 "$RUNNER_TEMP/altool.log" || true

          rm -rf "$RUNNER_TEMP/upload"
          cat > "$RUNNER_TEMP/UploadOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera18-appstore-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## App Store 包上传完成（生产配置，无 CAMERA18_TESTING）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Bundle ID | \`$BID\` |"
            echo "| 显示名 | $BDISPLAY |"
            echo "| 版本 | $BVER (\`$BBUILD\`) |"
            echo "| commit | \`${{ github.sha }}\` on \`${{ inputs.ref }}\` |"
            echo ""
            echo "### 接下来（提审）"
            echo ""
            echo "1. 打开 [App Store Connect](https://appstoreconnect.apple.com/) → App → **TestFlight**，等构建 Processing 完成（5-30 分钟）。"
            echo "2. 先装到自己的机器上做最后一轮真机回归（HANDOVER 待真机清单），确认无问题再提审。"
            echo "3. App Store Connect → App → **分发** → 创建/选择版本 → 构建选本包 → 提交 App 审核。"
            echo "4. 审核信息：Privacy Policy = cornpiess.github.io/camera18/privacy.html，Support URL = .../support.html；隐私标签「不收集数据」。"
          } >> "$GITHUB_STEP_SUMMARY"
